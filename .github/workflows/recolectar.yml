name: Recolectar brecha

on:
  schedule:
    # 12 corridas: 9:00 a 20:00 hora de Caracas (UTC-4)
    - cron: '0 13-23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:          # botón "Run workflow" para forzar una lectura

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar BCV y Binance
        run: python recolectar.py

      - name: Guardar la lectura
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "lectura $(TZ=America/Caracas date +%Y-%m-%d\ %H:%M)"
            git push
          fi
