name: Recolectar brecha

on:
  schedule:
    # Tres arranques al dia (UTC). Cada corrida mide cada 30 min durante ~4 h,
    # asi que basta con que uno arranque para cubrir buena parte del dia.
    # GitHub retrasa o descarta tareas programadas en repos gratuitos; este
    # diseno lo tolera porque no depende de un disparo por lectura.
    - cron: '7 13 * * *'    # 9:07 Caracas
    - cron: '7 17 * * *'    # 13:07 Caracas
    - cron: '7 21 * * *'    # 17:07 Caracas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Medir cada 30 minutos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 9); do
            h=$(TZ=America/Caracas date +%H)
            if [ "$h" -ge 9 ] && [ "$h" -le 20 ]; then
              python recolectar.py || echo "ciclo $i sin datos"
              git pull --rebase --quiet || true
              git add datos
              if git diff --staged --quiet; then
                echo "ciclo $i: nada que guardar"
              else
                git commit -q -m "lectura $(TZ=America/Caracas date +'%Y-%m-%d %H:%M')"
                git push -q || echo "push fallido, se reintenta en el proximo ciclo"
              fi
            else
              echo "ciclo $i: fuera de horario ($h h Caracas), no se mide"
            fi
            if [ "$i" -lt 9 ]; then sleep 1800; fi
          done
