name: Recolectar brecha

on:
  schedule:
    # Un intento cada hora. GitHub descarta o retrasa muchos, pero basta con
    # que uno arranque: cada corrida mide cada 30 min durante ~4,5 h, y la
    # siguiente que llegue toma el relevo al terminar (concurrency encola una).
    # El recolector no repite si la ultima lectura tiene menos de 20 min.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # historial completo: el rebase nunca falla por clon superficial

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Medir cada 30 minutos
        run: |
          h=$(TZ=America/Caracas date +%H)
          if [ "$h" -lt 8 ] || [ "$h" -gt 20 ]; then
            echo "Fuera de horario ($h h Caracas): esta corrida no hace nada."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          vacios=0
          for i in $(seq 1 9); do
            h=$(TZ=America/Caracas date +%H)
            if [ "$h" -ge 9 ] && [ "$h" -le 20 ]; then
              python recolectar.py || echo "ciclo $i: el recolector fallo"
              git pull --rebase --quiet || echo "ciclo $i: pull con problemas"
              git add datos
              if git diff --staged --quiet; then
                echo "ciclo $i: nada que guardar"
                vacios=$((vacios+1))
              else
                git commit -q -m "lectura $(TZ=America/Caracas date +'%Y-%m-%d %H:%M')"
                if git push -q; then
                  echo "ciclo $i: lectura guardada"
                  vacios=0
                else
                  echo "ciclo $i: push fallido"
                  git reset -q --soft HEAD~1
                  vacios=$((vacios+1))
                fi
              fi
              if [ "$vacios" -ge 3 ]; then
                echo "Tres ciclos seguidos sin guardar: esta corrida se rinde y libera la cola."
                exit 0
              fi
            else
              echo "ciclo $i: fuera de horario ($h h Caracas), no se mide"
            fi
            if [ "$i" -lt 9 ]; then sleep 1800; fi
          done
